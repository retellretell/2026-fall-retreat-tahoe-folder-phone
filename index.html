<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eaf8ff" />
  <meta name="description" content="2026 청년부 가을수련회 Tahoe · 부르신 자들 플레이리스트" />
  <title>부르신 자들 · 2026 가을수련회 Tahoe</title>

  <style>
    :root{
      --bg:#fbfeff;
      --bg2:#eaf8ff;
      --sky:#d6f0ff;
      --sky2:#b8e4f8;
      --blue:#79bfdf;
      --blue-deep:#4e88ac;
      --ink:#3c6d8b;
      --line:#badfed;
      --white:#fff;
      --pink:#ffd8e9;
      --shadow:0 26px 80px rgba(82,151,190,.22);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    button{font:inherit}

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 16% 12%,rgba(255,255,255,.98) 0 7%,transparent 18%),
        radial-gradient(circle at 84% 14%,rgba(214,239,252,.82) 0 8%,transparent 22%),
        linear-gradient(180deg,var(--bg2),var(--bg) 65%,#fff);
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    .page{
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:max(22px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom));
      position:relative;
      overflow:hidden;
    }

    .cloud{
      position:absolute;
      width:86px;height:32px;
      opacity:.82;
      filter:drop-shadow(0 8px 18px rgba(128,186,216,.14));
      background:
        radial-gradient(circle at 20px 18px,#fff 0 15px,transparent 16px),
        radial-gradient(circle at 42px 12px,#fff 0 19px,transparent 20px),
        radial-gradient(circle at 65px 18px,#fff 0 15px,transparent 16px),
        linear-gradient(#fff 0 0) 16px 16px/52px 16px no-repeat;
    }

    .star{
      position:absolute;width:12px;height:12px;
      background:
        linear-gradient(#ffe6a3 0 0) center/4px 12px no-repeat,
        linear-gradient(#ffe6a3 0 0) center/12px 4px no-repeat;
      animation:twinkle 3.4s ease-in-out infinite;
    }

    @keyframes twinkle{
      0%,100%{transform:scale(1);opacity:.58}
      50%{transform:scale(1.16);opacity:1}
    }

    .wrap{width:min(100%,430px);position:relative;z-index:1}

    .intro{text-align:center;margin-bottom:15px}
    .eyebrow{
      margin:0 0 7px;
      font-size:11px;font-weight:800;letter-spacing:.18em;
      color:#7eb5d3;text-transform:uppercase;
    }
    h1{
      margin:0;
      font-size:clamp(38px,12vw,58px);
      line-height:1;letter-spacing:-.06em;
      font-weight:900;color:#4f88ad;
    }
    .sub{
      margin:10px 0 0;
      font-size:14px;font-weight:650;color:#79aac7;
    }

    .phone{
      width:100%;max-width:390px;margin:auto;
      position:relative;
      filter:drop-shadow(var(--shadow));
    }

    .top-half,.bottom-half{
      position:relative;overflow:hidden;
      background:linear-gradient(180deg,#fff 0%,#eef9ff 28%,#d7f0ff 100%);
      border:2px solid #c7e7f6;
      box-shadow:inset 0 0 0 3px rgba(255,255,255,.72);
    }
    .top-half{
      border-radius:38px 38px 20px 20px;
      padding:16px 14px 14px;
    }
    .bottom-half{
      margin-top:-2px;
      border-radius:18px 18px 44px 44px;
      padding:17px 14px 20px;
    }

    .top-half::before,.bottom-half::before{
      content:"";
      position:absolute;inset:8px;
      border:1px solid rgba(117,184,218,.22);
      pointer-events:none;
    }
    .top-half::before{border-radius:30px 30px 14px 14px}
    .bottom-half::before{border-radius:14px 14px 36px 36px}

    .camera-bar{
      width:64px;height:8px;border-radius:999px;
      margin:0 auto 11px;
      background:#91cae5;
      box-shadow:inset 0 2px 3px rgba(76,132,161,.22);
      opacity:.78;
    }

    .lcd{
      position:relative;overflow:hidden;
      background:linear-gradient(180deg,#dff6ff 0%,#f6fcff 100%);
      border:4px solid #a9d7ee;
      box-shadow:inset 0 0 0 2px #fff,0 6px 0 rgba(92,157,191,.12);
      border-radius:20px;padding:10px;
    }
    .lcd::before{
      content:"";
      position:absolute;inset:0;pointer-events:none;z-index:3;
      background:linear-gradient(rgba(255,255,255,.08) 50%,transparent 50%);
      background-size:100% 4px;
      opacity:.45;
    }

    .statusbar{
      position:relative;z-index:4;
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:7px;padding:0 2px;
      font-size:10px;font-weight:800;color:#5f94b0;
    }
    .status-icons{display:flex;align-items:center;gap:5px}
    .signal{display:flex;align-items:flex-end;gap:2px;height:10px}
    .signal i{display:block;width:2px;background:#6b9fba;border-radius:1px}
    .signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}
    .signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:9px}
    .battery{width:17px;height:8px;border:1.5px solid #6b9fba;border-radius:2px;position:relative}
    .battery::before{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:10px;background:#83c6e5}
    .battery::after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:#6b9fba}

    .mp3-head{
      position:relative;z-index:4;
      display:grid;
      grid-template-columns:42px 1fr auto;
      gap:8px;align-items:center;
      padding:3px 3px 9px;
    }
    .pixel-sheep{width:42px;height:36px;image-rendering:pixelated}
    .mp3-copy{min-width:0}
    .mp3-copy strong{
      display:block;font-size:13px;letter-spacing:.04em;color:#4c83a6;
    }
    .mp3-copy span{
      display:block;margin-top:2px;
      font-size:10px;color:#7da8c0;font-weight:750;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .track-count{
      font-family:"Courier New",monospace;
      font-size:11px;font-weight:900;color:#5f93b1;
    }

    .player{
      position:relative;z-index:1;
      width:100%;
      aspect-ratio:4/3;
      min-height:200px;
      border-radius:12px;overflow:hidden;
      background:#cfefff;
      border:2px solid rgba(102,172,207,.24);
    }
    #yt-player,.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

    .info{
      position:relative;z-index:4;
      padding:8px 3px 1px;
    }
    .progress{
      height:7px;border-radius:3px;
      background:#cce8f5;border:1px solid #b9deef;overflow:hidden;
    }
    .progress > span{
      display:block;width:0;height:100%;
      background:linear-gradient(90deg,#79c9ef,#ffb9d8);
      transition:width .25s linear;
    }
    .time-row{
      display:flex;justify-content:space-between;align-items:center;
      margin-top:4px;
      font-family:"Courier New",monospace;
      font-size:9px;font-weight:900;color:#6f9db6;
    }
    .state{
      margin-top:5px;
      display:flex;justify-content:space-between;
      font-size:9px;font-weight:900;color:#6f9db6;letter-spacing:.08em;
    }

    .hinge{
      width:90px;height:18px;margin:0 auto;
      border-radius:14px;
      background:linear-gradient(180deg,#d2eefc,#b4def3);
      border-left:2px solid #b7e1f3;border-right:2px solid #b7e1f3;
      position:relative;
    }
    .hinge::before{
      content:"";position:absolute;left:50%;top:4px;transform:translateX(-50%);
      width:54px;height:8px;border-radius:999px;background:#90c8e3;opacity:.7;
    }

    .nav-area{
      display:grid;
      grid-template-columns:1fr 92px 1fr;
      gap:12px;align-items:center;
      padding:0 7px;margin-bottom:15px;
    }

    .soft-button{
      height:36px;border-radius:18px;
      border:1px solid #bfe1f1;
      background:linear-gradient(180deg,#fff,#eaf8ff);
      box-shadow:0 3px 0 rgba(111,167,197,.14);
      color:#6798b6;font-weight:900;font-size:11px;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .soft-button:active,.pad-btn:active,.key.action:active{
      transform:translateY(2px);
      box-shadow:none;
    }

    .dpad{
      width:92px;height:92px;border-radius:50%;
      background:linear-gradient(180deg,#f8fdff,#d8f1ff);
      border:1px solid #bfe1f1;
      box-shadow:inset 0 0 0 11px #edf9ff,0 4px 0 rgba(100,158,188,.14);
      position:relative;margin:auto;
    }
    .pad-btn{
      position:absolute;border:0;background:transparent;
      color:#72a7c4;font-weight:950;font-size:14px;
      cursor:pointer;z-index:2;padding:0;
      -webkit-tap-highlight-color:transparent;
    }
    .pad-up{left:36px;top:6px;width:20px;height:25px}
    .pad-down{left:36px;bottom:6px;width:20px;height:25px}
    .pad-left{left:6px;top:36px;width:25px;height:20px}
    .pad-right{right:6px;top:36px;width:25px;height:20px}
    .pad-ok{
      left:50%;top:50%;transform:translate(-50%,-50%);
      width:34px;height:34px;border-radius:50%;
      background:#fff;border:1px solid #b8ddec;
      display:grid;place-items:center;
      font-size:9px;color:#6294b1;
      box-shadow:0 2px 0 rgba(105,164,194,.15);
    }
    .pad-ok:active{transform:translate(-50%,-50%) translateY(2px)}

    .keypad{
      display:grid;grid-template-columns:repeat(3,1fr);
      gap:8px;padding:0 4px;
    }
    .key{
      min-height:41px;border-radius:17px;
      background:linear-gradient(180deg,#fff,#eaf8ff);
      border:1px solid #c3e4f3;
      box-shadow:0 3px 0 rgba(106,165,195,.14);
      display:flex;align-items:center;justify-content:center;flex-direction:column;
      color:#6f9db7;font-weight:900;font-size:13px;line-height:1;
    }
    button.key{cursor:pointer;-webkit-tap-highlight-color:transparent}
    .key small{margin-top:4px;font-size:7px;letter-spacing:.1em;font-weight:800;opacity:.72}
    .key.pink{background:linear-gradient(180deg,#fff9fc,#ffe3ef);border-color:#f3c8dc;color:#d98caf}
    .key.action{outline:none}
    .key.action:focus-visible,.soft-button:focus-visible,.pad-btn:focus-visible{
      outline:3px solid rgba(88,166,210,.25);outline-offset:2px;
    }

    .chin{width:56px;height:5px;margin:14px auto 0;border-radius:999px;background:#acd6e9;opacity:.72}

    @media(max-width:390px){
      .top-half{padding:14px 12px 12px;border-radius:32px 32px 18px 18px}
      .bottom-half{padding:16px 12px 18px;border-radius:16px 16px 38px 38px}
      .nav-area{grid-template-columns:1fr 80px 1fr}
      .dpad{width:80px;height:80px}
      .pad-up{left:30px}.pad-down{left:30px}
      .pad-left{top:30px}.pad-right{top:30px}
      .key{min-height:38px}
      .hinge{width:78px}
    }
  </style>
</head>
<body>
  <main class="page">
    <span class="cloud" style="left:3%;top:14%" aria-hidden="true"></span>
    <span class="cloud" style="right:4%;bottom:16%" aria-hidden="true"></span>
    <span class="star" style="left:12%;top:10%" aria-hidden="true"></span>
    <span class="star" style="right:12%;top:18%;animation-delay:.9s" aria-hidden="true"></span>

    <section class="wrap">
      <header class="intro">
        <p class="eyebrow">2026 FALL RETREAT · TAHOE</p>
        <h1>부르신 자들</h1>
        <p class="sub">청년부 가을수련회 플레이리스트</p>
      </header>

      <div class="phone">
        <div class="top-half">
          <div class="camera-bar"></div>

          <div class="lcd">
            <div class="statusbar">
              <span>MP3 · TAHOE</span>
              <div class="status-icons">
                <span class="signal"><i></i><i></i><i></i><i></i></span>
                <span class="battery"></span>
              </div>
            </div>

            <div class="mp3-head">
              <svg class="pixel-sheep" viewBox="0 0 42 36" aria-hidden="true">
                <rect x="10" y="6" width="22" height="18" fill="#fffdf8"/>
                <rect x="6" y="10" width="6" height="14" fill="#fffdf8"/>
                <rect x="30" y="10" width="6" height="14" fill="#fffdf8"/>
                <rect x="12" y="3" width="8" height="7" fill="#fffdf8"/>
                <rect x="21" y="2" width="8" height="8" fill="#fffdf8"/>
                <rect x="14" y="12" width="14" height="10" fill="#f5dccd"/>
                <rect x="10" y="14" width="4" height="7" fill="#f2cfbf"/>
                <rect x="28" y="14" width="4" height="7" fill="#f2cfbf"/>
                <rect x="17" y="15" width="2" height="2" fill="#526671"/>
                <rect x="23" y="15" width="2" height="2" fill="#526671"/>
                <rect x="19" y="20" width="4" height="2" fill="#526671"/>
                <rect x="13" y="24" width="5" height="5" fill="#d9b29f"/>
                <rect x="24" y="24" width="5" height="5" fill="#d9b29f"/>
                <rect x="16" y="22" width="3" height="2" fill="#f4b9c8"/>
                <rect x="23" y="22" width="3" height="2" fill="#f4b9c8"/>
              </svg>

              <div class="mp3-copy">
                <strong>RETREAT PLAYLIST</strong>
                <span id="trackLabel">PLAYER READY</span>
              </div>
              <div class="track-count" id="trackCount">--/--</div>
            </div>

            <div class="player">
              <div id="yt-player"></div>
            </div>

            <div class="info">
              <div class="progress"><span id="progressFill"></span></div>
              <div class="time-row">
                <span id="currentTime">00:00</span>
                <span id="duration">00:00</span>
              </div>
              <div class="state">
                <span id="playState">READY</span>
                <span id="volumeLabel">VOL 50</span>
              </div>
            </div>
          </div>
        </div>

        <div class="hinge" aria-hidden="true"></div>

        <div class="bottom-half">
          <div class="nav-area">
            <button class="soft-button" id="prevSoft" type="button">◀ PREV</button>

            <div class="dpad" aria-label="MP3 controls">
              <button class="pad-btn pad-up" id="volUp" type="button" aria-label="볼륨 올리기">＋</button>
              <button class="pad-btn pad-left" id="prevPad" type="button" aria-label="이전 곡">◀</button>
              <button class="pad-btn pad-ok" id="playPad" type="button" aria-label="재생 또는 일시정지">PLAY</button>
              <button class="pad-btn pad-right" id="nextPad" type="button" aria-label="다음 곡">▶</button>
              <button class="pad-btn pad-down" id="volDown" type="button" aria-label="볼륨 내리기">−</button>
            </div>

            <button class="soft-button" id="nextSoft" type="button">NEXT ▶</button>
          </div>

          <div class="keypad">
            <div class="key">1<small>♡</small></div>
            <button class="key action" id="key2" type="button">2<small>VOL +</small></button>
            <div class="key">3<small>DEF</small></div>

            <button class="key action" id="key4" type="button">4<small>PREV</small></button>
            <button class="key pink action" id="key5" type="button">5<small>PLAY</small></button>
            <button class="key action" id="key6" type="button">6<small>NEXT</small></button>

            <div class="key">7<small>PQRS</small></div>
            <button class="key action" id="key8" type="button">8<small>VOL −</small></button>
            <div class="key">9<small>WXYZ</small></div>

            <div class="key">*</div>
            <div class="key">0<small>+</small></div>
            <div class="key">#</div>
          </div>

          <div class="chin"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const PLAYLIST_ID = 'PLHEHHRGrwrkg';
    let player = null;
    let ready = false;
    let progressTimer = null;

    const $ = (id) => document.getElementById(id);

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
      const total = Math.floor(seconds);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    }

    function tapFeedback() {
      try { if (navigator.vibrate) navigator.vibrate(10); } catch (_) {}
    }

    function updateMeta() {
      if (!ready || !player) return;

      let list = [];
      let index = -1;
      try {
        list = player.getPlaylist() || [];
        index = player.getPlaylistIndex();
      } catch (_) {}

      if (index >= 0 && list.length) {
        $('trackCount').textContent =
          String(index + 1).padStart(2,'0') + '/' + String(list.length).padStart(2,'0');
        $('trackLabel').textContent = 'TRACK ' + String(index + 1).padStart(2,'0');
      } else {
        $('trackCount').textContent = '--/--';
      }

      try {
        const state = player.getPlayerState();
        const labels = {
          [-1]:'READY',
          [0]:'ENDED',
          [1]:'PLAYING',
          [2]:'PAUSED',
          [3]:'LOADING',
          [5]:'CUED'
        };
        $('playState').textContent = labels[state] || 'READY';
        $('playPad').textContent = state === 1 ? 'PAUSE' : 'PLAY';
        $('key5').querySelector('small').textContent = state === 1 ? 'PAUSE' : 'PLAY';
      } catch (_) {}

      try {
        const volume = player.getVolume();
        $('volumeLabel').textContent = 'VOL ' + Math.round(volume);
      } catch (_) {}
    }

    function updateProgress() {
      if (!ready || !player) return;
      try {
        const current = player.getCurrentTime() || 0;
        const duration = player.getDuration() || 0;
        $('currentTime').textContent = formatTime(current);
        $('duration').textContent = formatTime(duration);
        $('progressFill').style.width = duration > 0
          ? Math.min(100, (current / duration) * 100) + '%'
          : '0%';
      } catch (_) {}
    }

    function togglePlay() {
      if (!ready) return;
      tapFeedback();
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) player.pauseVideo();
      else player.playVideo();
      setTimeout(updateMeta, 80);
    }

    function nextTrack() {
      if (!ready) return;
      tapFeedback();
      player.nextVideo();
      setTimeout(updateMeta, 180);
    }

    function prevTrack() {
      if (!ready) return;
      tapFeedback();
      player.previousVideo();
      setTimeout(updateMeta, 180);
    }

    function changeVolume(delta) {
      if (!ready) return;
      tapFeedback();
      const next = Math.max(0, Math.min(100, player.getVolume() + delta));
      player.setVolume(next);
      updateMeta();
    }

    window.onYouTubeIframeAPIReady = function() {
      player = new YT.Player('yt-player', {
        width: '100%',
        height: '100%',
        playerVars: {
          listType: 'playlist',
          list: PLAYLIST_ID,
          playsinline: 1,
          controls: 0,
          rel: 0,
          autoplay: 0
        },
        events: {
          onReady: function(event) {
            ready = true;
            event.target.setVolume(50);
            updateMeta();
            updateProgress();
            progressTimer = setInterval(() => {
              updateProgress();
              updateMeta();
            }, 500);
          },
          onStateChange: function() {
            updateMeta();
            updateProgress();
          },
          onError: function() {
            $('playState').textContent = 'ERROR';
          }
        }
      });
    };

    const api = document.createElement('script');
    api.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(api);

    [
      ['playPad', togglePlay],
      ['key5', togglePlay],
      ['nextPad', nextTrack],
      ['nextSoft', nextTrack],
      ['key6', nextTrack],
      ['prevPad', prevTrack],
      ['prevSoft', prevTrack],
      ['key4', prevTrack],
      ['volUp', () => changeVolume(10)],
      ['key2', () => changeVolume(10)],
      ['volDown', () => changeVolume(-10)],
      ['key8', () => changeVolume(-10)]
    ].forEach(([id, fn]) => $(id).addEventListener('click', fn));

    window.addEventListener('beforeunload', () => {
      if (progressTimer) clearInterval(progressTimer);
    });
  </script>
</body>
</html>
