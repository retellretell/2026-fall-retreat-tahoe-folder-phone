<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eaf8ff" />
  <meta name="description" content="2026 청년부 가을수련회 Tahoe · 부르신 자들 플레이리스트" />
  <title>부르신 자들 · 2026 가을수련회 Tahoe</title>
  <style>
    :root{
      --bg:#f9fdff;
      --bg2:#e9f7ff;
      --sky:#d5effd;
      --sky2:#b6e2f7;
      --blue:#7dbfde;
      --blue-deep:#4f89ad;
      --ink:#3d6e8c;
      --line:#b9e0f1;
      --screen:#eaf8ff;
      --white:#ffffff;
      --pink:#ffd6e7;
      --shadow:0 26px 80px rgba(86,154,191,.20);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 16% 12%, rgba(255,255,255,.98) 0 7%, transparent 18%),
        radial-gradient(circle at 84% 14%, rgba(214,239,252,.8) 0 8%, transparent 22%),
        linear-gradient(180deg,var(--bg2),var(--bg) 65%, #fff);
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }

    .page{
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:max(22px, env(safe-area-inset-top)) 16px max(30px, env(safe-area-inset-bottom));
      position:relative;
      overflow:hidden;
    }

    .cloud{
      position:absolute;
      width:86px;
      height:32px;
      opacity:.82;
      filter:drop-shadow(0 8px 18px rgba(128,186,216,.14));
      background:
        radial-gradient(circle at 20px 18px,#fff 0 15px,transparent 16px),
        radial-gradient(circle at 42px 12px,#fff 0 19px,transparent 20px),
        radial-gradient(circle at 65px 18px,#fff 0 15px,transparent 16px),
        linear-gradient(#fff 0 0) 16px 16px/52px 16px no-repeat;
    }

    .star{
      position:absolute;
      width:12px;height:12px;
      background:
        linear-gradient(#ffe6a3 0 0) center/4px 12px no-repeat,
        linear-gradient(#ffe6a3 0 0) center/12px 4px no-repeat;
      animation:twinkle 3.4s ease-in-out infinite;
    }

    @keyframes twinkle{
      0%,100%{transform:scale(1);opacity:.58}
      50%{transform:scale(1.16);opacity:1}
    }

    .wrap{width:min(100%,430px); position:relative; z-index:1}

    .intro{text-align:center; margin-bottom:16px}
    .eyebrow{
      margin:0 0 7px;
      font-size:11px;
      font-weight:800;
      letter-spacing:.18em;
      color:#7eb5d3;
      text-transform:uppercase;
    }
    h1{
      margin:0;
      font-size:clamp(38px,12vw,58px);
      line-height:1;
      letter-spacing:-.06em;
      font-weight:900;
      color:#4f88ad;
    }
    .sub{
      margin:10px 0 0;
      font-size:14px;
      font-weight:650;
      color:#79aac7;
    }

    .phone{
      position:relative;
      width:100%;
      max-width:390px;
      margin:0 auto;
      filter:drop-shadow(var(--shadow));
    }

    .top-half,
    .bottom-half{
      background:linear-gradient(180deg,#ffffff 0%, #eef9ff 26%, #d7f0ff 100%);
      border:2px solid #c7e7f6;
      box-shadow:inset 0 0 0 3px rgba(255,255,255,.72);
      overflow:hidden;
      position:relative;
    }

    .top-half{
      border-radius:38px 38px 20px 20px;
      padding:16px 14px 14px;
    }

    .top-half::before,
    .bottom-half::before{
      content:"";
      position:absolute;
      inset:8px;
      border:1px solid rgba(117,184,218,.22);
      pointer-events:none;
    }

    .top-half::before{border-radius:30px 30px 14px 14px}
    .bottom-half::before{border-radius:14px 14px 36px 36px}

    .camera-bar{
      width:64px;height:8px;border-radius:999px;
      margin:0 auto 12px;
      background:#91cae5;
      box-shadow:inset 0 2px 3px rgba(76,132,161,.22);
      opacity:.78;
    }

    .lcd{
      background:linear-gradient(180deg,#dff6ff 0%,#f5fcff 100%);
      border:4px solid #a9d7ee;
      box-shadow:inset 0 0 0 2px #ffffff, 0 6px 0 rgba(92,157,191,.12);
      border-radius:20px;
      padding:10px;
      position:relative;
      overflow:hidden;
    }

    .lcd::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(rgba(255,255,255,.08) 50%,transparent 50%);
      background-size:100% 4px;
      opacity:.55;
    }

    .statusbar{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
      padding:0 2px;
      font-size:10px;
      font-weight:800;
      color:#5f94b0;
    }

    .status-icons{display:flex;align-items:center;gap:5px}
    .signal{display:flex;align-items:flex-end;gap:2px;height:10px}
    .signal i{display:block;width:2px;background:#6b9fba;border-radius:1px}
    .signal i:nth-child(1){height:3px}
    .signal i:nth-child(2){height:5px}
    .signal i:nth-child(3){height:7px}
    .signal i:nth-child(4){height:9px}
    .battery{width:17px;height:8px;border:1.5px solid #6b9fba;border-radius:2px;position:relative}
    .battery::before{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:10px;background:#83c6e5}
    .battery::after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:#6b9fba;border-radius:0 1px 1px 0}

    .lcd-title{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:5px 4px 10px;
      color:#4c83a6;
    }
    .lcd-title strong{font-size:14px;letter-spacing:.02em}

    .pixel-sheep{width:42px;height:36px;flex:0 0 auto;image-rendering:pixelated}

    .player{
      position:relative;
      z-index:1;
      width:100%;
      aspect-ratio:16/9;
      border-radius:12px;
      overflow:hidden;
      background:#cfefff;
      border:2px solid rgba(102,172,207,.24);
    }
    .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

    .softkeys{
      position:relative;
      z-index:1;
      display:flex;
      justify-content:space-between;
      padding:8px 4px 0;
      font-size:10px;
      font-weight:800;
      color:#6c9db8;
    }

    .hinge{
      width:90px;
      height:18px;
      margin:0 auto;
      border-radius:14px;
      background:linear-gradient(180deg,#d2eefc 0%, #b4def3 100%);
      border-left:2px solid #b7e1f3;
      border-right:2px solid #b7e1f3;
      position:relative;
    }
    .hinge::before{
      content:"";
      position:absolute;
      left:50%; top:4px;
      transform:translateX(-50%);
      width:54px;height:8px;
      border-radius:999px;
      background:#90c8e3;
      opacity:.7;
    }

    .bottom-half{
      margin-top:-2px;
      border-radius:18px 18px 44px 44px;
      padding:18px 14px 20px;
    }

    .nav-area{
      display:grid;
      grid-template-columns:1fr 88px 1fr;
      gap:12px;
      align-items:center;
      margin-bottom:16px;
      padding:0 8px;
    }

    .soft-button{
      height:34px;
      border-radius:18px;
      background:linear-gradient(180deg,#fff,#eaf8ff);
      border:1px solid #c0e3f3;
      box-shadow:0 3px 0 rgba(111,167,197,.14);
    }

    .dpad{
      width:88px;height:88px;border-radius:50%;
      background:linear-gradient(180deg,#f8fdff,#d8f1ff);
      border:1px solid #bfe1f1;
      box-shadow:inset 0 0 0 11px #edf9ff, 0 4px 0 rgba(100,158,188,.14);
      position:relative;
      margin:auto;
    }
    .dpad::before,.dpad::after{content:"";position:absolute;background:#84bddd;opacity:.76;border-radius:2px}
    .dpad::before{width:30px;height:6px;left:29px;top:41px}
    .dpad::after{width:6px;height:30px;left:41px;top:29px}
    .ok{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      width:30px;height:30px;border-radius:50%;
      background:#fff;border:1px solid #b8ddec;z-index:2;
      display:grid;place-items:center;font-size:9px;font-weight:900;color:#6b9cb7;
    }

    .keypad{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      padding:0 4px;
    }

    .key{
      min-height:42px;
      border-radius:17px;
      background:linear-gradient(180deg,#ffffff 0%,#eaf8ff 100%);
      border:1px solid #c3e4f3;
      box-shadow:0 3px 0 rgba(106,165,195,.14);
      display:flex;align-items:center;justify-content:center;flex-direction:column;
      color:#6f9db7;font-weight:900;font-size:13px;line-height:1;
    }
    .key small{margin-top:4px;font-size:7px;letter-spacing:.12em;font-weight:800;opacity:.7}
    .key.pink{background:linear-gradient(180deg,#fff9fc,#ffe3ef);border-color:#f3c8dc;color:#d98caf}

    .chin{width:56px;height:5px;margin:14px auto 0;border-radius:999px;background:#acd6e9;opacity:.72}
    .note{text-align:center;margin:12px 0 0;font-size:11px;color:#8ab2c7;font-weight:650}

    @media(max-width:390px){
      .top-half{padding:14px 12px 12px;border-radius:32px 32px 18px 18px}
      .bottom-half{padding:16px 12px 18px;border-radius:16px 16px 38px 38px}
      .nav-area{grid-template-columns:1fr 76px 1fr}
      .dpad{width:76px;height:76px}
      .dpad::before{width:26px;left:25px;top:35px}
      .dpad::after{height:26px;left:35px;top:25px}
      .key{min-height:39px}
      .hinge{width:78px}
    }
  </style>
</head>
<body>
  <main class="page">
    <span class="cloud" style="left:3%;top:14%" aria-hidden="true"></span>
    <span class="cloud" style="right:4%;bottom:16%" aria-hidden="true"></span>
    <span class="star" style="left:12%;top:10%" aria-hidden="true"></span>
    <span class="star" style="right:12%;top:18%;animation-delay:.9s" aria-hidden="true"></span>
    <span class="star" style="left:20%;bottom:19%;animation-delay:1.4s" aria-hidden="true"></span>

    <section class="wrap">
      <header class="intro">
        <p class="eyebrow">2026 FALL RETREAT · TAHOE</p>
        <h1>부르신 자들</h1>
        <p class="sub">청년부 가을수련회 플레이리스트</p>
      </header>

      <div class="phone" aria-label="flip phone themed playlist player">
        <div class="top-half">
          <div class="camera-bar"></div>

          <div class="lcd">
            <div class="statusbar">
              <span>TAHOE</span>
              <div class="status-icons">
                <span class="signal"><i></i><i></i><i></i><i></i></span>
                <span class="battery"></span>
              </div>
            </div>

            <div class="lcd-title">
              <strong>PLAYLIST</strong>
              <svg class="pixel-sheep" viewBox="0 0 42 36" aria-hidden="true">
                <rect x="10" y="6" width="22" height="18" fill="#fffdf8"/>
                <rect x="6" y="10" width="6" height="14" fill="#fffdf8"/>
                <rect x="30" y="10" width="6" height="14" fill="#fffdf8"/>
                <rect x="12" y="3" width="8" height="7" fill="#fffdf8"/>
                <rect x="21" y="2" width="8" height="8" fill="#fffdf8"/>
                <rect x="14" y="12" width="14" height="10" fill="#f5dccd"/>
                <rect x="10" y="14" width="4" height="7" fill="#f2cfbf"/>
                <rect x="28" y="14" width="4" height="7" fill="#f2cfbf"/>
                <rect x="17" y="15" width="2" height="2" fill="#526671"/>
                <rect x="23" y="15" width="2" height="2" fill="#526671"/>
                <rect x="19" y="20" width="4" height="2" fill="#526671"/>
                <rect x="13" y="24" width="5" height="5" fill="#d9b29f"/>
                <rect x="24" y="24" width="5" height="5" fill="#d9b29f"/>
                <rect x="16" y="22" width="3" height="2" fill="#f4b9c8"/>
                <rect x="23" y="22" width="3" height="2" fill="#f4b9c8"/>
              </svg>
            </div>

            <div class="player">
              <iframe
                src="https://www.youtube.com/embed/videoseries?list=PLHEHHRGrwrkg"
                title="2026 청년부 가을수련회 플레이리스트"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
              </iframe>
            </div>

            <div class="softkeys">
              <span>MENU</span>
              <span>PLAY</span>
            </div>
          </div>
        </div>

        <div class="hinge" aria-hidden="true"></div>

        <div class="bottom-half" aria-hidden="true">
          <div class="nav-area">
            <div class="soft-button"></div>
            <div class="dpad"><div class="ok">OK</div></div>
            <div class="soft-button"></div>
          </div>

          <div class="keypad">
            <div class="key">1<small>♡</small></div>
            <div class="key">2<small>ABC</small></div>
            <div class="key">3<small>DEF</small></div>
            <div class="key">4<small>GHI</small></div>
            <div class="key pink">5<small>JKL</small></div>
            <div class="key">6<small>MNO</small></div>
            <div class="key">7<small>PQRS</small></div>
            <div class="key">8<small>TUV</small></div>
            <div class="key">9<small>WXYZ</small></div>
            <div class="key">*</div>
            <div class="key">0<small>+</small></div>
            <div class="key">#</div>
          </div>

          <div class="chin"></div>
        </div>
      </div>

      <p class="note">같은 플레이리스트 링크를 계속 사용하므로 곡이 바뀌어도 그대로 반영됩니다.</p>
    </section>
  </main>
</body>
</html>
